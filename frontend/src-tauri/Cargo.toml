[package]
name = "tigertrack-ai-desktop"
version = "3.2.0"
description = "TIGERTRACK AI — Pench Tiger Reserve Intelligence Platform"
edition = "2021"
authors = ["Pench Tiger Intelligence Team"]

[lib]
name = "tigertrack_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
